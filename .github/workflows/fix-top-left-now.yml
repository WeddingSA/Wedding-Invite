name: Final top-left floral fix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-top-left-now.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fix only the top-left floral
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='src="/assets/floral-top-left-transparent.png"'
          new='src="/assets/floral-bottom-right.webp"'
          if old not in s:
              raise SystemExit('Expected top-left floral source not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Clean temporary fix files and commit
        run: |
          git config user.name "WeddingSA Automation"
          git config user.email "actions@users.noreply.github.com"
          rm -f scripts/cache-bust-top-floral.mjs .github/workflows/cache-bust-top-floral.yml README-TEMP.txt assets/floral-top-left-v2.webp assets/floral-top-left-v3-note.txt
          git add -A
          git rm .github/workflows/fix-top-left-now.yml
          git commit -m "Show top-left floral and keep bottom-right unchanged"
          git push origin main
