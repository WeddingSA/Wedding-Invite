name: Use floral image assets
on:
  push:
    branches:
      - floral-assets-only
    paths:
      - '.github/workflows/use-floral-images.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: floral-assets-only
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Replace only floral decoration
        run: node scripts/use-floral-images.mjs
      - name: Commit floral-only update and remove updater
        run: |
          git config user.name "WeddingSA Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm scripts/use-floral-images.mjs .github/workflows/use-floral-images.yml
          git add index.html
          git commit -m "Use approved floral images on first page"
          git push origin floral-assets-only
