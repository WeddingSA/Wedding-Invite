name: Fix floral display
on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix-floral-display.mjs'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply floral-only fix
        run: node scripts/fix-floral-display.mjs
      - name: Commit floral-only fix
        run: |
          git config user.name "WeddingSA Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git rm scripts/fix-floral-display.mjs .github/workflows/fix-floral-display.yml
          git commit -m "Fix transparent top floral and resize bottom floral"
          git push origin main
