name: Refine invite foliage
on:
  push:
    paths:
      - '.github/workflows/refine-invite-foliage.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Refine first-page foliage
        run: node scripts/refine-invite-foliage.mjs
      - name: Commit and clean up
        run: |
          git config user.name "WeddingSA Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm scripts/refine-invite-foliage.mjs .github/workflows/refine-invite-foliage.yml
          git add index.html
          git commit -m "Match invite foliage placement and style"
          git push
