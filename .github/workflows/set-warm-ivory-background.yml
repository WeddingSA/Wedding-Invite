name: Set warm ivory background
on:
  push:
    paths:
      - '.github/workflows/set-warm-ivory-background.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply single warm ivory background
        run: node scripts/set-warm-ivory-background.mjs
      - name: Commit background adjustment
        run: |
          git config user.name "WeddingSA Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Match invitation background to floral artwork"
          git push origin main
