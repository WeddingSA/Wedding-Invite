name: Fix mobile top-left floral
on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix-mobile-top-floral.mjs'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/fix-mobile-top-floral.mjs
      - run: |
          git config user.name "WeddingSA Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Reduce mobile top-left floral overlap" || exit 0
          git push
