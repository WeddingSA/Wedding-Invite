name: Unify invitation background
on:
  push:
    branches: [main]
    paths:
      - 'scripts/unify-invitation-background.mjs'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply one background colour
        run: node scripts/unify-invitation-background.mjs
      - name: Commit single background colour
        run: |
          git config user.name "WeddingSA Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git rm scripts/unify-invitation-background.mjs .github/workflows/unify-invitation-background.yml
          git commit -m "Use one invitation background colour"
          git push origin main
